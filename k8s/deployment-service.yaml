apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment-angel-fix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: simulacionim:latest
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-service-angel-fix
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080